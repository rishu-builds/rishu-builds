<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="50%" stop-color="#0A1329" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#8A2BE2" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.95" />
    </linearGradient>

    <!-- Main Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Top Badge Fill Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8A2BE2" stop-opacity="0.25" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="45" result="blur" />
    </filter>

    <!-- Tech Grid Pattern -->
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#00D2FF" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Container Base -->
  <rect x="1.5" y="1.5" width="697" height="287" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Ambient Glow Spots -->
  <circle cx="80" cy="50" r="130" fill="#00D2FF" filter="url(#glow)" opacity="0.22" />
  <circle cx="620" cy="240" r="140" fill="#8A2BE2" filter="url(#glow)" opacity="0.25" />

  <!-- Grid Overlay -->
  <rect x="1.5" y="1.5" width="697" height="287" rx="20" fill="url(#grid)" />

  <!-- Decorative Cyber Corner Accents -->
  <path d="M 20 40 L 20 20 L 40 20" fill="none" stroke="#00D2FF" stroke-width="2.5" opacity="0.8" />
  <path d="M 680 40 L 680 20 L 660 20" fill="none" stroke="#00D2FF" stroke-width="2.5" opacity="0.8" />
  <path d="M 20 250 L 20 270 L 40 270" fill="none" stroke="#00D2FF" stroke-width="2.5" opacity="0.8" />
  <path d="M 680 250 L 680 270 L 660 270" fill="none" stroke="#00D2FF" stroke-width="2.5" opacity="0.8" />

  <!-- Top Pill Badge -->
  <rect x="235" y="24" width="230" height="26" rx="13" fill="url(#badgeGrad)" stroke="#00D2FF" stroke-width="1.2" stroke-opacity="0.55" />
  <text x="350" y="41" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5px" fill="#00D2FF">⚡ INDIE CREATOR &amp; DEVELOPER</text>

  <!-- Main Name Title -->
  <text x="350" y="106" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="900" letter-spacing="-0.5px" fill="url(#titleGrad)">Rishabh Yadav</text>

  <!-- Subtitle Line 1 (Role & University) -->
  <text x="350" y="154" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#38BDF8">🚀 Aspiring Full-Stack Web &amp; AI Developer | BCA Student @ Dr. RMLAU</text>

  <!-- Subtitle Line 2 (Tech Stack Pill) -->
  <rect x="30" y="192" width="640" height="50" rx="25" fill="#070D1D" stroke="#1E293B" stroke-width="1.4" />
  <text x="350" y="223" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16.5" font-weight="600" fill="#94A3B8">
    <tspan fill="#00D2FF">C/C++</tspan>  •  <tspan fill="#38BDF8">Python</tspan>  •  <tspan fill="#FACC15">JavaScript</tspan>  •  <tspan fill="#60A5FA">SQL</tspan>  •  <tspan fill="#C084FC">Building GenAI Apps</tspan>
  </text>
</svg>
