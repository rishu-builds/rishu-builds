<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0A1224" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8A2BE2" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.8" />
    </linearGradient>

    <!-- Main Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Top Badge Fill Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#8A2BE2" stop-opacity="0.18" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="55" result="blur" />
    </filter>

    <!-- Subtle Tech Grid -->
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#00D2FF" stroke-width="0.5" stroke-opacity="0.06" />
    </pattern>
  </defs>

  <!-- Container Base -->
  <rect x="1" y="1" width="918" height="238" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Ambient Glow Spots -->
  <circle cx="90" cy="50" r="130" fill="#00D2FF" filter="url(#glow)" opacity="0.16" />
  <circle cx="830" cy="190" r="140" fill="#8A2BE2" filter="url(#glow)" opacity="0.18" />

  <!-- Grid Overlay -->
  <rect x="1" y="1" width="918" height="238" rx="16" fill="url(#grid)" />

  <!-- Decorative Corner Accents -->
  <path d="M 20 35 L 20 20 L 35 20" fill="none" stroke="#00D2FF" stroke-width="2" opacity="0.6" />
  <path d="M 900 35 L 900 20 L 885 20" fill="none" stroke="#00D2FF" stroke-width="2" opacity="0.6" />
  <path d="M 20 205 L 20 220 L 35 220" fill="none" stroke="#00D2FF" stroke-width="2" opacity="0.6" />
  <path d="M 900 205 L 900 220 L 885 220" fill="none" stroke="#00D2FF" stroke-width="2" opacity="0.6" />

  <!-- Top Pill Badge -->
  <rect x="350" y="24" width="220" height="24" rx="12" fill="url(#badgeGrad)" stroke="#00D2FF" stroke-width="1" stroke-opacity="0.35" />
  <text x="460" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5px" fill="#00D2FF">⚡ INDIE CREATOR &amp; DEVELOPER</text>

  <!-- Main Name Title -->
  <text x="460" y="98" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5px" fill="url(#titleGrad)">Rishabh Yadav</text>

  <!-- Subtitle Line 1 (Role & University) -->
  <text x="460" y="138" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" fill="#38BDF8">🚀 Aspiring Full-Stack Web &amp; AI Developer  |  BCA Student @ Dr. RMLAU</text>

  <!-- Subtitle Line 2 (Tech Stack Pill) -->
  <rect x="150" y="166" width="620" height="38" rx="19" fill="#070D1B" stroke="#1E293B" stroke-width="1.2" />
  <text x="460" y="190" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13.5" font-weight="600" fill="#94A3B8">
    <tspan fill="#00D2FF">C/C++</tspan>  •  <tspan fill="#38BDF8">Python</tspan>  •  <tspan fill="#FACC15">JavaScript</tspan>  •  <tspan fill="#60A5FA">SQL</tspan>  •  <tspan fill="#C084FC">Building GenAI Apps</tspan>
  </text>
</svg>
